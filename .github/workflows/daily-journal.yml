name: Daily Coursework Journal Submission

on:
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday–Friday only
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Decode storageState.json from Secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing or empty!"
            exit 1
          fi
          echo "$STORAGE_STATE_BASE64" | tr -d '\r\n' | base64 -d > storageState.json
          echo "storageState.json restored successfully."

      - name: Get current date in target timezone
        id: date
        run: echo "today=$(node -e 'import("./src/summarizer.js").then(m => console.log(m.getFormattedToday(process.env.TIMEZONE || "Asia/Kolkata")))')" >> $GITHUB_OUTPUT
        env:
          TIMEZONE: ${{ secrets.TIMEZONE }}

      - name: Restore daily submission state from cache
        uses: actions/cache/restore@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Run Journal Submission Script
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          ENTRY_MAP: ${{ secrets.ENTRY_MAP }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          COMMIT_READ_TOKEN: ${{ secrets.COMMIT_READ_TOKEN }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_STATE_PATH: storageState.json
          DISABLE_SUBMIT: "false"
          DRY_RUN: "false"
        run: npm start

      - name: Save daily submission state to cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}
